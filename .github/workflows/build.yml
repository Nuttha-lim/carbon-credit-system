name: C checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: ['0', '1']
    env:
      SANITIZE: ${{ matrix.sanitize }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run regression checks
        run: python3 tests/run_tests.py
